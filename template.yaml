AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  surfcoin — single stack for the whole app. Static site (private S3 + CloudFront
  with OAC, ACM cert, Route53) for surfcoin.fail (primary) with surfcoin.aillc.link
  kept as a convenience alias, plus the pump.fun playground backend: Cognito
  managed-login PKCE client, DynamoDB, KMS, a Node Lambda behind an HTTP API with
  a Cognito JWT authorizer, and a 1-minute EventBridge tick for the autopilot rule
  engine. Deploy in us-east-1 (CloudFront requires its ACM cert there).

Parameters:
  DomainName:
    Type: String
    Default: surfcoin.fail
    Description: Primary apex domain (production).
  FailHostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for surfcoin.fail.
  AliasDomainName:
    Type: String
    Default: surfcoin.aillc.link
    Description: Optional convenience alias domain served by the same distribution.
  AliasHostedZoneId:
    Type: String
    Default: ""
    Description: >
      Route53 hosted zone ID for the alias domain. Leave empty to serve only the
      primary domain (the default in the dedicated prod account).
  CognitoDomainPrefix:
    Type: String
    Default: surfcoin-play
    Description: Globally unique (per region) Cognito hosted-login domain prefix.
  AlarmEmail:
    Type: String
    Default: samuelvange@gmail.com
    Description: >
      Address subscribed to the operational-alarm SNS topic. Confirm the SNS
      subscription email once after the first deploy. Override per environment
      via a stack parameter if a shared inbox is preferred.

Conditions:
  HasAlias: !Not [!Equals [!Ref AliasHostedZoneId, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active

Resources:
  # ── Static site: S3 + CloudFront ────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${DomainName}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # One cert covering both domains, DNS-validated in each domain's own zone.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
        - !If [HasAlias, !Ref AliasDomainName, !Ref "AWS::NoValue"]
        - !If [HasAlias, !Sub "www.${AliasDomainName}", !Ref "AWS::NoValue"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref FailHostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref FailHostedZoneId
        - !If
          - HasAlias
          - DomainName: !Ref AliasDomainName
            HostedZoneId: !Ref AliasHostedZoneId
          - !Ref "AWS::NoValue"
        - !If
          - HasAlias
          - DomainName: !Sub "www.${AliasDomainName}"
            HostedZoneId: !Ref AliasHostedZoneId
          - !Ref "AWS::NoValue"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
          - !If [HasAlias, !Ref AliasDomainName, !Ref "AWS::NoValue"]
          - !If [HasAlias, !Sub "www.${AliasDomainName}", !Ref "AWS::NoValue"]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # surfcoin.fail (+www)
  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref FailHostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
  ApexRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref FailHostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
  WwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref FailHostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
  WwwRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref FailHostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }

  # surfcoin.aillc.link (+www) — optional convenience alias
  AliasApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasAlias
    Properties:
      HostedZoneId: !Ref AliasHostedZoneId
      Name: !Ref AliasDomainName
      Type: A
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
  AliasApexRecordV6:
    Type: AWS::Route53::RecordSet
    Condition: HasAlias
    Properties:
      HostedZoneId: !Ref AliasHostedZoneId
      Name: !Ref AliasDomainName
      Type: AAAA
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
  AliasWwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasAlias
    Properties:
      HostedZoneId: !Ref AliasHostedZoneId
      Name: !Sub "www.${AliasDomainName}"
      Type: A
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
  AliasWwwRecordV6:
    Type: AWS::Route53::RecordSet
    Condition: HasAlias
    Properties:
      HostedZoneId: !Ref AliasHostedZoneId
      Name: !Sub "www.${AliasDomainName}"
      Type: AAAA
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }

  # ── Identity ────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      DeletionProtection: INACTIVE
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  # Role groups — membership lands in tokens as the cognito:groups claim.
  # No group = pending approval (the default for fresh signups).
  ApprovedGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: approved
      UserPoolId: !Ref UserPool
      Description: Users approved to use the playground API.

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Can manage users (approve accounts, change roles).

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: playground-spa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub "https://${DomainName}/playground"
        - !Sub "https://www.${DomainName}/playground"
        - !Sub "https://${AliasDomainName}/playground"
        - !Sub "https://www.${AliasDomainName}/playground"
        - http://localhost:5173/playground
        - http://localhost:37740/playground
      LogoutURLs:
        - !Sub "https://${DomainName}/playground"
        - !Sub "https://www.${DomainName}/playground"
        - !Sub "https://${AliasDomainName}/playground"
        - !Sub "https://www.${AliasDomainName}/playground"
        - http://localhost:5173/playground
        - http://localhost:37740/playground
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  # ── Data ────────────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    # Retain so a stack teardown never silently drops linked keys / rules.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-data"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  CredentialsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts linked pump.fun / PumpPortal credentials at rest.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  CredentialsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}"
      TargetKeyId: !Ref CredentialsKey

  # ── API Lambda ──────────────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      # Pre-bundled by esbuild (npm run build:backend) — CodeUri holds index.js.
      CodeUri: backend/dist/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          KMS_KEY_ID: !Ref CredentialsKey
          SITE_ORIGIN: !Sub "https://${DomainName}"
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt]
              Resource: !GetAtt CredentialsKey.Arn
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt UserPool.Arn

  # ── HTTP API with Cognito JWT auth ─────────────────────────────────────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${DomainName}"
          - !Sub "https://www.${DomainName}"
          - !Sub "https://${AliasDomainName}"
          - !Sub "https://www.${AliasDomainName}"
          - http://localhost:5173
          - http://localhost:37740
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: cognito
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  # Explicit method routes (not ANY): OPTIONS is intentionally NOT routed so
  # API Gateway's automatic CORS answers preflight. An ANY route would send the
  # browser's unauthenticated OPTIONS through the JWT authorizer, which 401s and
  # breaks every cross-origin call.
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${HttpApiIntegration}"
  PostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${HttpApiIntegration}"
  PutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${HttpApiIntegration}"
  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${HttpApiIntegration}"

  # Public, unauthenticated read-only route for the /coins page.
  PublicGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /public/{proxy+}"
      AuthorizationType: NONE
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # ── Autopilot tick ─────────────────────────────────────────────────────────
  AutopilotTick:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-autopilot"
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: api-function
          Arn: !GetAtt ApiFunction.Arn
          Input: '{"source":"autopilot-tick"}'

  AutopilotInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutopilotTick.Arn

  # ── Observability: admin-notifying alarms + dashboard ───────────────────────
  # Alarms notify a human via SNS email; the dashboard gives at-a-glance health.
  # Provisioned in IaC so incident visibility exists by construction.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"
      DisplayName: surfcoin operational alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-errors"
      AlarmDescription: The API Lambda is returning function errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-throttles"
      AlarmDescription: The API Lambda is being throttled (concurrency exhausted).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-latency"
      AlarmDescription: API Lambda p95 duration is approaching the 30s timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  HttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-http-5xx"
      AlarmDescription: The HTTP API is returning 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Lambda — invocations / errors / throttles",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}" ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}" ],
                  [ "AWS/Lambda", "Throttles", "FunctionName", "${ApiFunction}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Lambda — duration (ms)",
                "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "stat": "p50", "label": "p50" } ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "stat": "p95", "label": "p95" } ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "stat": "Maximum", "label": "max" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "HTTP API — requests / 4xx / 5xx",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiId", "${HttpApi}" ],
                  [ "AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}" ],
                  [ "AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB — consumed capacity / throttles",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${Table}" ],
                  [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${Table}" ],
                  [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${Table}" ]
                ]
              }
            }
          ]
        }

Outputs:
  SiteUrl:
    Value: !Sub "https://${DomainName}"
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  TableName:
    Value: !Ref Table
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Description: SNS topic that fan-outs operational alarms to the admin email.
