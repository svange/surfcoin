# .github/.ai-compliance.yaml
# Per-repo overrides for the org-wide compliance engine.
# surfcoin is a Node (Vite/React + Node Lambda) service deployed via SAM, and a
# personal side-project, so it deviates from the canonical Python service shape.

# Single-environment repo: main deploys straight to production; there is no
# staging deploy target. This one declaration makes the staging-family
# standards (promotion gated on staging, staging seeded, staging cost)
# inapplicable -- they drop off the ladder instead of needing per-standard
# opt-outs.
environment_model: single

metadata:
  standards_version: "2026-04-22"
  last_standardized: "2026-08-01"
  last_standardized_by: "samuelvange@gmail.com"
  notes: >-
    Node/Vite + SAM, not Python/uv. Single-environment (main -> production
    only; declared above). A `dev` integration branch exists, but there is no
    separate staging deploy target. Lives in a shared sandbox account with a
    dedicated per-repo deploy role (surfcoin-deploy) rather than the org
    pipeline roles. LGPL-3.0 is permitted in the repo-local license gate
    (rpc-websockets, transitive via @solana/web3.js, unmodified weak-copyleft
    bundle); strong copyleft still fails. Historical decisions and their
    reasoning live in CLAUDE.md ("Current, explained exceptions") -- entries
    for the retired ai-cc-tools check ids (deploy.*, compliance.*) were
    pruned from this file on 2026-08-01 because no current org standard
    carries those ids.
