# .github/.ai-compliance.yaml
# Per-repo overrides for the org-wide compliance engine.
# surfcoin is a Node (Vite/React + Node Lambda) service deployed via SAM, and a
# personal side-project, so it deviates from the canonical Python service shape.
metadata:
  standards_version: "2026-04-22"
  last_standardized: "2026-07-29"
  last_standardized_by: "samuelvange@gmail.com"
  notes: >-
    Node/Vite + SAM, not Python/uv. Single-environment (main -> production only).
    A `dev` integration branch exists, but there is no separate staging *deploy
    target* — main deploys straight to production. Lives in a shared sandbox
    account, so it uses its own scoped deploy role rather than the org
    PIPELINE/CLOUDFORMATION execution roles. Merge gates are enforced by the
    default-branch ruleset (required checks + code-owner review).

overrides:
  deploy.oidc_trust_scoped:
    reason: "Dedicated per-repo deploy role in a shared sandbox account; not the org pipeline role."
    created_at: 2026-07-20
    approved_by: "samuelvange@gmail.com"
    role_name_template: "surfcoin-deploy"

  compliance.license_copyleft:
    reason: >-
      LGPL-3.0 is permitted. The only LGPL dependency is rpc-websockets, pulled
      in transitively by @solana/web3.js and used as an unmodified bundled
      library (weak copyleft). The CI license gate still fails on strong
      copyleft (GPL/AGPL/SSPL).
    created_at: 2026-07-21
    approved_by: "samuelvange@gmail.com"

disabled_checks:
  - id: deploy.dev_branch_promotion
    reason: "Single-environment side project — main deploys straight to production, no dev->main promotion."
    created_at: 2026-07-20
    approved_by: "samuelvange@gmail.com"
  - id: deploy.health_probe
    reason: "Static marketing site; smoke test checks the homepage + /playground return 200 instead of a /health endpoint."
    created_at: 2026-07-20
    approved_by: "samuelvange@gmail.com"
  - id: ci.promotion_gated_on_staging
    reason: >-
      No separate staging deploy target exists. This is a single-environment
      side project: main deploys directly to production. Post-deploy acceptance
      (Playwright e2e + smoke tests) runs against the production SHA after each
      merge; there is no staging environment for a same-SHA pre-promotion gate,
      so the "staging acceptance before promotion" pattern does not apply.
    created_at: 2026-07-29
    approved_by: "samuelvange@gmail.com"
  - id: ops.staging_seeded
    reason: >-
      No staging environment to seed (single-environment side project). The
      production data plane is real user state (Cognito accounts, linked keys)
      and must not be seeded with fixtures; playground trading is dry-run by
      default via the liveTrading safety gate, so no seeded test data is needed.
    created_at: 2026-07-29
    approved_by: "samuelvange@gmail.com"
