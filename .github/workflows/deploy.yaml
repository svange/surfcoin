name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type-check frontend + backend
        run: |
          npx tsc -b
          npx tsc -p backend/tsconfig.json --noEmit
      - name: Lint (ESLint static analysis)
        run: npx eslint .

  security:
    name: Security
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dependency audit (high+, enforced)
        # Enforcing gate — no suppression. Fails the build on any high/critical
        # advisory in production deps. Reviewed, non-applicable advisories are
        # documented in audit-ci.jsonc (not silently swallowed).
        run: npx audit-ci --config audit-ci.jsonc
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/typescript
            p/react
            p/security-audit
            p/secrets
            p/owasp-top-ten

  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: License check (fail on strong copyleft)
        # Fails on strong copyleft (GPL/AGPL/SSPL) that would force disclosing our
        # own source. LGPL is permitted — the only LGPL dep is rpc-websockets,
        # pulled in transitively by @solana/web3.js and used as an unmodified
        # bundled library (see .github/.ai-compliance.yaml).
        run: |
          npx --yes license-checker --production --summary --excludePrivatePackages \
            --failOn 'GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;SSPL-1.0'

  build-validation:
    name: Build validation
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - run: npm ci
      - name: Build backend bundle
        run: npm run build:backend
      - name: Build frontend
        run: npm run build
      - name: SAM validate
        run: sam validate --lint --region us-east-1

  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage (enforced threshold)
        # vitest exits non-zero if the coverage thresholds in vitest.config.ts
        # are breached — coverage is a real merge gate, not just collected.
        run: npx vitest run --coverage
      - name: Upload test report + coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: |
            coverage/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [code-quality, security, compliance, build-validation, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    outputs:
      site-url: ${{ steps.outputs.outputs.site-url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - run: npm ci

      - name: Build backend bundle
        run: npm run build:backend

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: surfcoin-deploy
          role-duration-seconds: 3600

      - name: Deploy stack (SAM)
        run: |
          # SAMDeployRole (assumed above) passes the account's CloudFormation
          # execution role to CFN; artifacts go to the org-provisioned bucket.
          sam deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --s3-bucket "${{ vars.ARTIFACTS_BUCKET }}" \
            --role-arn "${{ vars.CFN_EXEC_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset \
            --parameter-overrides \
              DomainName="${{ vars.DOMAIN_NAME }}" \
              FailHostedZoneId="${{ vars.FAIL_HOSTED_ZONE_ID }}" \
              CognitoDomainPrefix="${{ vars.COGNITO_DOMAIN_PREFIX }}"

      - name: Publish frontend
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: npm run publish:frontend

      - name: Stack outputs
        id: outputs
        run: |
          SITE_URL=$(aws cloudformation describe-stacks --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "site-url=${SITE_URL}" >> "$GITHUB_OUTPUT"

  e2e:
    name: Browser e2e (post-deploy)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e against the live site
        env:
          SITE_URL: ${{ needs.deploy.outputs.site-url }}
        run: npx playwright test --project=chromium
      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
      # GitHub Pages serves ONE deployment, owned by this job. Fold the
      # unit-test coverage report into the same artifact under /unit/ so it gets
      # a stable published URL (…/surfcoin/unit/) instead of only the ephemeral
      # per-run `unit-test-report` download. Regenerated here from the deployed
      # commit — the "Tests" gate already enforced it, this run only produces the
      # report to publish — and nested next to the e2e report at the site root.
      - name: Stage unit-test coverage report under /unit/
        if: always()
        run: |
          npx vitest run --coverage
          mkdir -p playwright-report/unit
          cp -R coverage/. playwright-report/unit/
      # Publish the reports on always() — a failing run is exactly when the
      # scrubbable video/trace timeline is worth having one click away.
      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          # Self-enable Pages (Actions source) on first run so the report has a
          # home without a manual Settings toggle.
          enablement: true
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: playwright-report
      - name: Publish report to GitHub Pages
        id: pages
        if: always()
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Site + API reachable
        env:
          SITE_URL: ${{ needs.deploy.outputs.site-url }}
        run: |
          set -e
          echo "Checking ${SITE_URL} ..."
          SITE=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/")
          PLAY=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/playground")
          echo "site=$SITE playground=$PLAY"
          [ "$SITE" = "200" ] && [ "$PLAY" = "200" ]

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: npx --yes semantic-release
