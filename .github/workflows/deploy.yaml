name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type-check frontend + backend
        run: |
          npx tsc -b
          npx tsc -p backend/tsconfig.json --noEmit

  security:
    name: Security
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high --omit=dev || true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/typescript
            p/react
            p/security-audit
            p/secrets
            p/owasp-top-ten

  build-validation:
    name: Build validation
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - run: npm ci
      - name: Build backend bundle
        run: npm run build:backend
      - name: Build frontend
        run: npm run build
      - name: SAM validate
        run: sam validate --lint --region us-east-1

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [code-quality, security, build-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    outputs:
      site-url: ${{ steps.outputs.outputs.site-url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - run: npm ci

      - name: Build backend bundle
        run: npm run build:backend

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: surfcoin-deploy
          role-duration-seconds: 3600

      - name: Deploy stack (SAM)
        run: |
          sam deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset \
            --parameter-overrides \
              DomainName="${{ vars.DOMAIN_NAME }}" \
              FailHostedZoneId="${{ vars.FAIL_HOSTED_ZONE_ID }}" \
              AliasDomainName="${{ vars.ALIAS_DOMAIN_NAME }}" \
              AliasHostedZoneId="${{ vars.ALIAS_HOSTED_ZONE_ID }}" \
              CognitoDomainPrefix="${{ vars.COGNITO_DOMAIN_PREFIX }}"

      - name: Publish frontend
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: npm run publish:frontend

      - name: Stack outputs
        id: outputs
        run: |
          SITE_URL=$(aws cloudformation describe-stacks --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "site-url=${SITE_URL}" >> "$GITHUB_OUTPUT"

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Site + API reachable
        env:
          SITE_URL: ${{ needs.deploy.outputs.site-url }}
        run: |
          set -e
          echo "Checking ${SITE_URL} ..."
          SITE=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/")
          PLAY=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/playground")
          echo "site=$SITE playground=$PLAY"
          [ "$SITE" = "200" ] && [ "$PLAY" = "200" ]

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: npx --yes semantic-release
