name: Scheduled maintenance

# Self-healing / decay detection beyond dependency updates (Renovate handles those).
# A cron job exercises the live system on a schedule and auto-triages failures by
# opening (or refreshing) an incident issue, and auto-resolves it when healthy
# again — so routine breakage is noticed and tracked without a human watching.
on:
  schedule:
    - cron: "23 8 * * *" # daily, 08:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

env:
  SITE_URL: https://surfcoin.fail
  INCIDENT_LABEL: incident
  INCIDENT_TITLE: "🚨 Scheduled health check failing"
  DEPS_INCIDENT_TITLE: "🚨 Dependency automation (Renovate) has gone silent"
  # Renovate's own cadence here is weekly (Sunday) plus monthly lockfile
  # maintenance, so a quiet fortnight is normal. 30 days matches the org
  # `deps.updates_flowing` standard's window.
  MAX_QUIET_DAYS: "30"

jobs:
  health-check:
    name: Health check + auto-triage
    runs-on: ubuntu-latest
    steps:
      - name: Probe live site + public routes
        id: probe
        run: |
          set -uo pipefail
          fail=0
          report=""
          for path in "/" "/playground" "/coins"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "${SITE_URL}${path}" || echo "000")
            line="GET ${path} -> ${code}"
            echo "$line"
            report="${report}\n- \`${path}\` → ${code}"
            [ "$code" = "200" ] || fail=1
          done
          {
            echo "failed=${fail}"
            echo "report<<EOF"
            echo -e "${report}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh incident issue on failure
        if: steps.probe.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$INCIDENT_LABEL" -R "$REPO" -c FBCA04 -d "Automated incident from scheduled maintenance" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --state open --label "$INCIDENT_LABEL" \
            --search "in:title $INCIDENT_TITLE" --json number --jq '.[0].number // empty')
          body=$(printf 'Scheduled health check found one or more routes unhealthy.\n%b\n\nRun: %s' "${{ steps.probe.outputs.report }}" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$INCIDENT_TITLE" --label "$INCIDENT_LABEL" --body "$body"
          fi

      - name: Auto-resolve incident issue when healthy
        if: steps.probe.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue list -R "$REPO" --state open --label "$INCIDENT_LABEL" \
            --search "in:title $INCIDENT_TITLE" --json number --jq '.[].number' | while read -r n; do
            [ -n "$n" ] || continue
            gh issue comment "$n" -R "$REPO" --body "Health check recovered — all monitored routes returned 200. Closing."
            gh issue close "$n" -R "$REPO" --reason completed
          done

      - name: Fail the run if unhealthy
        if: steps.probe.outputs.failed == '1'
        run: exit 1

  # Renovate keeps dependencies fresh, but nothing noticed when Renovate itself
  # stopped (it never started: the app was never granted this repo, so no PR and
  # no Dependency Dashboard issue ever appeared — see issue #25). Same
  # open/refresh/auto-resolve triage as the health check above, applied to the
  # automation instead of the site.
  #
  # This is the honest alarm for `deps.updates_flowing`, and it stays failing
  # until updates actually flow. `.github/workflows/renovate.yaml` deliberately
  # does NOT fail when it is inert — a workflow that skips is not evidence of
  # freshness, so the alarm lives here and reads real Renovate activity instead.
  dependency-freshness:
    name: Dependency automation freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read # search/issues returns Renovate's PRs too
    steps:
      - name: Look for recent Renovate activity
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Searching issues *and* PRs in one query means a repo that is
          # genuinely up to date still looks alive via its Dependency Dashboard
          # issue, instead of false-alarming on a quiet fortnight.
          #
          # Two probes, because Renovate can reach this repo two ways and they
          # author differently:
          #   - the hosted GitHub App authors as `app/renovate`;
          #   - self-hosted Renovate (.github/workflows/renovate.yaml) authors
          #     as the RENOVATE_TOKEN user, so it is recognised by the
          #     `renovate` label that renovate.json5 puts on every PR.
          # Either one flowing means dependency updates are flowing.
          probe() {
            gh api -X GET search/issues \
              -f q="repo:${REPO} $1" \
              -f sort=updated -f order=desc -f per_page=1 \
              --jq '.items[0].updated_at // empty'
          }
          hosted=$(probe "author:app/renovate")
          selfhosted=$(probe "label:renovate")
          latest=""
          via=""
          for candidate in "hosted:${hosted}" "self-hosted:${selfhosted}"; do
            value="${candidate#*:}"
            [ -n "$value" ] || continue
            if [ -z "$latest" ] || [ "$(date -u -d "$value" +%s)" -gt "$(date -u -d "$latest" +%s)" ]; then
              latest="$value"
              via="${candidate%%:*}"
            fi
          done
          if [ -z "$latest" ]; then
            stale=1
            detail="No Renovate pull request or issue has **ever** existed in this repository — neither the hosted app (no \`app/renovate\` activity) nor the self-hosted workflow (no \`renovate\`-labelled PR) has run. Most likely the app is not granted access to the repo *and* no \`RENOVATE_TOKEN\` secret is set."
          else
            age=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 86400 ))
            detail="Most recent Renovate activity (${via}): \`${latest}\` (${age} day(s) ago; threshold ${MAX_QUIET_DAYS})."
            if [ "$age" -gt "$MAX_QUIET_DAYS" ]; then stale=1; else stale=0; fi
          fi
          echo "$detail"
          {
            echo "stale=${stale}"
            echo "detail=${detail}"
          } >> "$GITHUB_OUTPUT"

      - name: Open incident issue when automation is silent
        if: steps.probe.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          set -euo pipefail
          gh label create "$INCIDENT_LABEL" -R "$REPO" -c FBCA04 -d "Automated incident from scheduled maintenance" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --state open --label "$INCIDENT_LABEL" \
            --search "in:title $DEPS_INCIDENT_TITLE" --json number --jq '.[0].number // empty')
          # Refresh nothing if it is already open — the body says everything and a
          # daily comment would just bury it.
          if [ -n "$existing" ]; then
            echo "Incident #${existing} already open; leaving it alone."
            exit 0
          fi
          body=$(printf '%s\n\nDependency updates are not flowing. Renovate config is committed at `renovate.json5`, so this is not a config problem — it is about whether Renovate *runs* here at all, and whether its PRs can merge themselves. There are two ways to make it run, either one is enough:\n\n1. grant the hosted **Renovate GitHub App** access to this repo, or\n2. set a **`RENOVATE_TOKEN`** secret, which switches on the self-hosted `.github/workflows/renovate.yaml` (it ships inert without one).\n\nBoth are repository settings. The operator checklist is in #25.\n\nThis issue closes itself once Renovate activity reappears by either route.\n\nRun: %s' "$DETAIL" "$RUN_URL")
          gh issue create -R "$REPO" --title "$DEPS_INCIDENT_TITLE" --label "$INCIDENT_LABEL" --body "$body"

      - name: Auto-resolve incident issue when updates are flowing again
        if: steps.probe.outputs.stale == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          set -euo pipefail
          gh issue list -R "$REPO" --state open --label "$INCIDENT_LABEL" \
            --search "in:title $DEPS_INCIDENT_TITLE" --json number --jq '.[].number' | while read -r n; do
            [ -n "$n" ] || continue
            gh issue comment "$n" -R "$REPO" --body "Dependency automation is alive again. ${DETAIL} Closing."
            gh issue close "$n" -R "$REPO" --reason completed
          done

      - name: Fail the run if automation is silent
        if: steps.probe.outputs.stale == '1'
        run: exit 1
